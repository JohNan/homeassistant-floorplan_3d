[project]
name = "homeassistant-floorplan-3d"
version = "0.1.0"
description = "Home Assistant 3D Floorplan Editor & Lovelace Card"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py312"
line-length = 100
